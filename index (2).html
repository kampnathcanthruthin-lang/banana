<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเช็คชื่อ 6/8 - รร.แม่สะเรียง "บริพัตรศึกษา"</title>
    <meta name="description" content="ระบบเช็คชื่อแถวหน้าเสาธง มัธยมศึกษาปีที่ 6/8 โรงเรียนแม่สะเรียง 'บริพัตรศึกษา'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --u: min(calc(100vw / 1600), calc(100vh / 900));
            --cream: #f5efe2;
            --emerald: #064e3b;
            --emerald-light: #10b981;
            --gold: #eab308;
            --dark: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: #020617;
            color: var(--cream);
            font-family: 'Manrope', 'Sarabun', system-ui, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 3D Canvas */
        #valley { position: fixed; inset: 0; z-index: 0; }
        .js-canvas-container { position: absolute; inset: 0; }
        .js-canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }
        
        /* UI Layer */
        .ui {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .ui.on { opacity: 1; }
        .ui a, .ui button, .ui input, .ui select, .ui form, .ui .glass-card, .ui .popup-overlay { pointer-events: auto; }

        /* Header Navigation */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(24 * var(--u)) calc(44 * var(--u)) 0;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--cream);
        }
        .logo-img {
            width: calc(38 * var(--u));
            height: calc(38 * var(--u));
            min-width: 36px; min-height: 36px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            background: #fff;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }
        .brand-title {
            font-size: calc(20 * var(--u));
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--cream);
        }
        .brand-sub {
            font-size: calc(12 * var(--u));
            color: var(--gold);
            opacity: 0.9;
        }
        .nav-pill {
            display: inline-flex;
            align-items: center;
            height: calc(42 * var(--u));
            padding: 0 calc(22 * var(--u));
            border-radius: 99px;
            background: rgba(245, 239, 226, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 239, 226, 0.25);
            color: var(--cream);
            font-size: calc(13 * var(--u));
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Hero Area & Content Container */
        .hero-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: calc(650 * var(--u));
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 3;
        }
        h1.hero-title {
            font-family: 'Antonio', 'Sarabun', sans-serif;
            font-weight: 700;
            font-size: calc(72 * var(--u));
            line-height: 0.95;
            letter-spacing: -0.012em;
            color: var(--cream);
            white-space: nowrap;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            margin-bottom: calc(8 * var(--u));
        }
        .hero-subtitle {
            font-size: calc(18 * var(--u));
            color: var(--gold);
            margin-bottom: calc(24 * var(--u));
            letter-spacing: 0.05em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        /* Glassmorphism Card for Attendance Form */
        .glass-card {
            width: 100%;
            background: rgba(6, 40, 30, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(234, 179, 8, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: calc(24 * var(--u));
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group { margin-bottom: 14px; }
        .form-label {
            display: block;
            font-size: calc(13 * var(--u));
            font-weight: 500;
            color: var(--cream);
            margin-bottom: 6px;
        }
        .form-input, .form-select {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(245, 239, 226, 0.2);
            border-radius: 10px;
            padding: calc(10 * var(--u)) calc(14 * var(--u));
            font-family: 'Sarabun', sans-serif;
            font-size: calc(14 * var(--u));
            color: #fff;
            outline: none;
            transition: all 0.25s ease;
        }
        .form-input:focus, .form-select:focus {
            border-color: var(--gold);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.3);
        }

        /* CTA Button */
        .cta-btn {
            width: 100%;
            height: calc(48 * var(--u));
            min-height: 44px;
            margin-top: 8px;
            border: none;
            border-radius: 99px;
            background: linear-gradient(135deg, #ca8a04 0%, #15803d 100%);
            color: #ffffff;
            font-family: 'Manrope', 'Sarabun', sans-serif;
            font-size: calc(15 * var(--u));
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(21, 128, 61, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(202, 138, 4, 0.5);
        }

        /* Table Area */
        .table-title {
            font-size: calc(14 * var(--u));
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .table-wrap {
            max-height: calc(150 * var(--u));
            overflow-y: auto;
            border-radius: 8px;
        }
        table { width: 100%; border-collapse: collapse; font-size: calc(13 * var(--u)); }
        th {
            background: rgba(234, 179, 8, 0.15);
            color: var(--gold);
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            position: sticky; top: 0;
            backdrop-filter: blur(8px);
        }
        td { padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); color: var(--cream); }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 50px;
            font-size: calc(11 * var(--u));
            font-weight: 600;
        }
        .badge-on-time { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .badge-late { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid #eab308; }
        .badge-leave { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .badge-absent { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        /* Custom Popup Modal Styles */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .popup-overlay.show {
            display: flex;
            opacity: 1;
        }
        .popup-box {
            background: rgba(6, 40, 30, 0.85);
            border: 1px solid rgba(234, 179, 8, 0.4);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .popup-overlay.show .popup-box {
            transform: scale(1);
        }
        .popup-icon {
            font-size: 42px;
            margin-bottom: 12px;
            animation: bounce 1.5s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .popup-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--cream);
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .popup-btn {
            background: linear-gradient(135deg, #ca8a04 0%, #15803d 100%);
            color: #ffffff;
            border: none;
            border-radius: 99px;
            padding: 12px 32px;
            font-family: 'Manrope', 'Sarabun', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(21, 128, 61, 0.4);
            transition: all 0.2s ease;
        }
        .popup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(202, 138, 4, 0.6);
        }

        /* Bottom Corner Control */
        .corner {
            position: absolute;
            right: calc(44 * var(--u));
            bottom: calc(44 * var(--u));
            display: flex;
            align-items: center;
            gap: calc(18 * var(--u));
            font-size: calc(12.5 * var(--u));
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--cream);
            opacity: 0.8;
        }
        .corner i { width: 1px; height: calc(26 * var(--u)); background: rgba(245, 239, 226, 0.3); }
        .sound-btn {
            width: calc(32 * var(--u));
            height: calc(32 * var(--u));
            display: grid;
            place-items: center;
            border: 1px solid rgba(245, 239, 226, 0.4);
            border-radius: 50%;
            background: none;
            color: var(--cream);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .sound-btn:hover { background: rgba(245, 239, 226, 0.2); }
        .sound-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }

        /* Loader Overlay */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 99;
            display: grid;
            place-items: center;
            background: #020617;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        .loader.gone { opacity: 0; }
        .loader-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 20px var(--gold);
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse { 50% { transform: scale(0.3); opacity: 0.4; } }

        /* Mobile Breakpoints */
        @media (max-width: 820px) {
            :root { --u: 1px; }
            header { padding: 16px 16px 0; }
            h1.hero-title { font-size: clamp(36px, 9vw, 52px); white-space: normal; }
            .hero-subtitle { font-size: 14px; margin-bottom: 14px; }
            .hero-container { top: 52%; max-width: 95%; padding: 0 10px; }
            .glass-card { padding: 14px; margin-bottom: 10px; border-radius: 16px; }
            .form-input, .form-select { padding: 8px 12px; font-size: 14px; }
            .cta-btn { height: 42px; font-size: 14px; }
            .corner { right: 16px; bottom: 20px; font-size: 10px; }
        }
    </style>
</head>
<body>

<div id="valley"><div class="js-canvas-container"></div></div>

<!-- Popup Modal -->
<div class="popup-overlay" id="popupModal">
    <div class="popup-box">
        <div class="popup-icon">💖</div>
        <div class="popup-text">ได้บันทึกข้อมูลของคนน่ารักเรียบร้อยแล้วครับ</div>
        <button class="popup-btn" onclick="closePopup()">ตกลง</button>
    </div>
</div>

<div class="ui" id="ui">
    <header>
        <a class="brand-logo" href="#">
            <img src="logo.png" alt="โลโก้โรงเรียน" class="logo-img">
            <div>
                <div class="brand-title">รร.แม่สะเรียง "บริพัตรศึกษา"</div>
                <div class="brand-sub">ระบบเช็คชื่อแถวหน้าเสาธง</div>
            </div>
        </a>
        <div class="nav-pill">มัธยมศึกษาปีที่ 6/8</div>
    </header>

    <div class="hero-container">
        <h1 class="hero-title">ระบบเช็คชื่อ 6/8</h1>
        <div class="hero-subtitle">โรงเรียนแม่สะเรียง "บริพัตรศึกษา"</div>

        <div class="glass-card">
            <form id="checkinForm">
                <div class="form-group">
                    <label class="form-label">รหัสนักเรียน / เลขที่</label>
                    <input type="text" class="form-input" id="studentId" placeholder="กรอกรหัสนักเรียน..." required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">สถานะการมาเรียน</label>
                    <select class="form-select" id="status">
                        <option value="มาทันเวลา">✅ มาทันเวลา</option>
                        <option value="มาสาย">⚠️ มาสาย</option>
                        <option value="ลา">🟦 ลา (มีใบลา)</option>
                        <option value="ขาด">❌ ขาดเรียน</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn" class="cta-btn">บันทึกข้อมูลเข้าสู่ระบบ</button>
            </form>
        </div>

        <div class="glass-card">
            <div class="table-title">📊 รายงานการเข้าแถววันนี้</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>เวลา</th>
                            <th>รหัส</th>
                            <th>สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="resultTable">
                        <tr><td colspan="3" style="text-align: center; opacity: 0.6;">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="corner">
        <span>3D Ambient Experience</span>
        <i></i>
        <button class="sound-btn" id="soundBtn" aria-label="Toggle Sound">
            <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        </button>
    </div>
</div>

<div class="loader" id="loader"><div class="loader-dot"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // ฝังลิงก์ Google Apps Script ของคุณเรียบร้อยแล้ว
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwcRtM9amOcrQfxwx1-_L0n7efhDXC3vv4EXxX_RewVBSBI9MZAbDlFj-6QvrjHpQUP/exec";

    // --- Popup Control Functions ---
    function showPopup() {
        const modal = document.getElementById('popupModal');
        modal.classList.add('show');
    }

    function closePopup() {
        const modal = document.getElementById('popupModal');
        modal.classList.remove('show');
    }

    // --- Three.js Smooth Glow Valley Scene ---
    let scene, camera, renderer, particles, particleGeo, material;
    let particleCount = 7000;
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;

    function createSmoothGlowTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        grad.addColorStop(0.2, 'rgba(234, 179, 8, 0.9)');
        grad.addColorStop(0.5, 'rgba(16, 185, 129, 0.4)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
    }

    function init3D() {
        const container = document.querySelector('.js-canvas-container');
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.0012);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
        camera.position.set(0, 150, 400);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        particleGeo = new THREE.BufferGeometry();
        const pos = [], colors = [];
        const color1 = new THREE.Color(0xeab308);
        const color2 = new THREE.Color(0x10b981);
        const color3 = new THREE.Color(0xf5efe2);

        for (let i = 0; i < particleCount; i++) {
            const x = (Math.random() - 0.5) * 1600;
            const z = (Math.random() - 0.5) * 1600;
            const y = Math.sin(x * 0.005) * Math.cos(z * 0.005) * 80 + (Math.random() - 0.5) * 40;
            pos.push(x, y, z);

            let c = Math.random() > 0.6 ? color1 : (Math.random() > 0.3 ? color2 : color3);
            colors.push(c.r, c.g, c.b);
        }

        particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        particleGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        material = new THREE.PointsMaterial({
            size: 16,
            map: createSmoothGlowTexture(),
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        particles = new THREE.Points(particleGeo, material);
        scene.add(particles);

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.1;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.1;
        });

        window.addEventListener('resize', onWindowResize);

        setTimeout(() => {
            document.getElementById('loader').classList.add('gone');
            document.getElementById('ui').classList.add('on');
        }, 800);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        targetX += (mouseX - targetX) * 0.05;
        targetY += (mouseY - targetY) * 0.05;

        camera.position.x = targetX;
        camera.position.y = 150 - targetY;
        camera.lookAt(0, 0, 0);

        particles.rotation.y += 0.0008;
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init3D();

    // --- Google Apps Script Integration ---
    document.getElementById('checkinForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('studentId').value.trim();
        const status = document.getElementById('status').value;
        const btn = document.getElementById('submitBtn');

        btn.style.opacity = '0.6';
        btn.disabled = true;

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ studentId: id, status: status })
        })
        .then(res => res.json())
        .then(res => {
            // แสดงป็อปอัพ "ได้บันทึกข้อมูลของคนน่ารักเรียบร้อยแล้วครับ"
            showPopup();
            
            document.getElementById('studentId').value = '';
            document.getElementById('studentId').focus();
            loadData();
        })
        .catch(() => {
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง");
        })
        .finally(() => {
            btn.style.opacity = '1';
            btn.disabled = false;
        });
    });

    function loadData() {
        if(!WEB_APP_URL) return;
        fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('resultTable');
            tbody.innerHTML = '';
            if(!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; opacity: 0.6;">ยังไม่มีข้อมูลวันนี้</td></tr>`;
                return;
            }
            data.reverse().forEach(row => {
                let tr = document.createElement('tr');
                let timeStr = new Date(row.timestamp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                
                let badgeClass = 'badge-on-time';
                if(row.status === 'มาสาย') badgeClass = 'badge-late';
                else if(row.status === 'ลา') badgeClass = 'badge-leave';
                else if(row.status === 'ขาด') badgeClass = 'badge-absent';

                tr.innerHTML = `
                    <td>${timeStr}</td>
                    <td style="font-weight: 600;">${row.studentId}</td>
                    <td><span class="badge ${badgeClass}">${row.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }).catch(err => console.error(err));
    }

    loadData();
</script>
</body>
</html>
